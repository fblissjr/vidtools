<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>vidtools</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Login screen -->
    <div id="login-screen" class="screen">
      <div class="login-box">
        <h1>vidtools</h1>
        <p id="login-subtitle">Sign in to continue</p>
        <form id="login-form">
          <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
          <button type="submit" id="login-btn">Sign In</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Setup screen (first run) -->
    <div id="setup-screen" class="screen" hidden>
      <div class="login-box">
        <h1>vidtools</h1>
        <p>Set a password to get started</p>
        <form id="setup-form">
          <input type="password" id="setup-password" placeholder="Choose a password (8+ chars)" minlength="8" required>
          <input type="password" id="setup-confirm" placeholder="Confirm password" minlength="8" required>
          <button type="submit">Set Password</button>
        </form>
        <p id="setup-error" class="error" hidden></p>
      </div>
    </div>

    <!-- Main app -->
    <div id="main-screen" class="screen" hidden>
      <header>
        <h1>vidtools</h1>
        <button id="logout-btn" class="icon-btn" title="Log out">Logout</button>
      </header>

      <nav class="tab-bar">
        <button class="tab active" data-tab="ytdlp">YouTube</button>
        <button class="tab" data-tab="process">Process</button>
        <button class="tab" data-tab="files">Files</button>
      </nav>

      <!-- YouTube Download Tab -->
      <section id="tab-ytdlp" class="tab-content active">
        <div class="card">
          <h2>Download from YouTube</h2>
          <div class="form-group">
            <label for="yt-url">YouTube URL</label>
            <input type="url" id="yt-url" placeholder="Paste YouTube link here..." class="large-input">
          </div>
          <div class="format-selector">
            <button class="format-btn active" data-format="mp3">MP3</button>
            <button class="format-btn" data-format="wav">WAV</button>
            <button class="format-btn" data-format="mp4">MP4</button>
          </div>
          <button id="yt-download-btn" class="primary-btn">Download</button>
        </div>
      </section>

      <!-- Process File Tab -->
      <section id="tab-process" class="tab-content">
        <div class="card">
          <h2>Process a File</h2>

          <div class="upload-area" id="upload-area">
            <p>Tap to select a file or drag & drop</p>
            <input type="file" id="file-input" accept="video/*,audio/*" hidden>
          </div>
          <div id="upload-status" hidden>
            <span id="upload-filename"></span>
            <button class="small-btn" id="clear-upload">Clear</button>
          </div>

          <div class="form-group">
            <label for="operation-select">Operation</label>
            <select id="operation-select">
              <option value="">-- Select --</option>
              <option value="resize">Resize</option>
              <option value="convert">Convert</option>
              <option value="cut">Cut / Trim</option>
              <option value="extract-audio">Extract Audio</option>
              <option value="crop">Crop</option>
              <option value="rotate">Rotate</option>
              <option value="preset">Apply Preset</option>
            </select>
          </div>

          <!-- Operation-specific params -->
          <div id="params-resize" class="op-params" hidden>
            <div class="form-group">
              <label>Resize by percentage</label>
              <input type="number" id="resize-pct" placeholder="50" min="1" max="400" step="1">
              <span class="hint">% of original size</span>
            </div>
          </div>

          <div id="params-convert" class="op-params" hidden>
            <div class="form-group">
              <label>Output format</label>
              <select id="convert-format">
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
                <option value="gif">GIF</option>
                <option value="mkv">MKV</option>
                <option value="avi">AVI</option>
              </select>
            </div>
          </div>

          <div id="params-cut" class="op-params" hidden>
            <div class="form-row">
              <div class="form-group">
                <label>Start time</label>
                <input type="text" id="cut-start" placeholder="00:00:00">
              </div>
              <div class="form-group">
                <label>End time</label>
                <input type="text" id="cut-end" placeholder="00:01:00">
              </div>
            </div>
            <label class="checkbox-label">
              <input type="checkbox" id="cut-copy" checked> Fast mode (no re-encode)
            </label>
          </div>

          <div id="params-extract-audio" class="op-params" hidden>
            <div class="form-group">
              <label>Audio format</label>
              <select id="audio-format">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
                <option value="aac">AAC</option>
                <option value="flac">FLAC</option>
              </select>
            </div>
          </div>

          <div id="params-crop" class="op-params" hidden>
            <div class="form-row">
              <div class="form-group">
                <label>Width</label>
                <input type="number" id="crop-w" placeholder="640">
              </div>
              <div class="form-group">
                <label>Height</label>
                <input type="number" id="crop-h" placeholder="480">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>X offset</label>
                <input type="number" id="crop-x" placeholder="0" value="0">
              </div>
              <div class="form-group">
                <label>Y offset</label>
                <input type="number" id="crop-y" placeholder="0" value="0">
              </div>
            </div>
          </div>

          <div id="params-rotate" class="op-params" hidden>
            <div class="form-group">
              <label>Rotation</label>
              <select id="rotate-deg">
                <option value="90">90 degrees</option>
                <option value="180">180 degrees</option>
                <option value="270">270 degrees</option>
              </select>
            </div>
          </div>

          <div id="params-preset" class="op-params" hidden>
            <div class="form-group">
              <label>Preset</label>
              <select id="preset-select">
                <option value="">Loading...</option>
              </select>
            </div>
          </div>

          <button id="process-btn" class="primary-btn" disabled>Process</button>
        </div>
      </section>

      <!-- Files Tab -->
      <section id="tab-files" class="tab-content">
        <div class="card">
          <div class="files-header">
            <h2>My Files</h2>
            <button id="refresh-files-btn" class="small-btn">Refresh</button>
          </div>
          <div id="file-list">
            <p class="empty-state">No files yet</p>
          </div>
        </div>
      </section>

      <!-- Active Jobs (persistent bottom bar) -->
      <div id="jobs-bar" hidden>
        <div id="jobs-list"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
