[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidtools"
version = "0.26.0"
description = "FFmpeg + PIL + yt-dlp media processing CLI (video, image, audio)"
readme = "README.md"
license = {file = "LICENSE"}

requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.69.0",
    "structlog>=26.1.0",
    # AVIF encode/decode is built in from 11.3, which `compress --allow-avif`
    # and the `.avif` save path rely on; the floor tracks the tested version
    # rather than the minimum that could work.
    "Pillow>=12.3.0",
    "numpy>=2.5.1",
    "yt-dlp>=2026.7.4",
    "orjson>=3.11.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Graphics",
]
keywords = ["ffmpeg", "video", "image", "audio", "pil", "conversion", "editing", "multimedia", "yt-dlp"]

[project.optional-dependencies]
# Audio source separation (mel-band roformer, BS-roformer, Demucs, MDX-Net, VR).
# Pulls in torch + onnxruntime + librosa. Install with: uv sync --extra separation
separation = [
    "audio-separator[cpu]>=0.30.0",
]

[project.scripts]
vidtools = "vidtools.cli:main"
vt = "vidtools.cli:main"

[project.urls]
Homepage = "https://github.com/fredbliss/vidtools"
Repository = "https://github.com/fredbliss/vidtools"
Issues = "https://github.com/fredbliss/vidtools/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vidtools*"]


[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "ffmpeg: requires real ffmpeg/ffprobe on PATH",
    "pil_real: exercises real PIL encode/decode; no external toolchain needed",
]
